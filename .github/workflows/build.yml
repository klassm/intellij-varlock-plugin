name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin test

      - name: Copy zip to stable name
        run: cp build/distributions/intellij-varlock-plugin-*.zip build/distributions/intellij-varlock-plugin-latest.zip

      - name: Archive plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: intellij-varlock-plugin
          path: build/distributions/*.zip

      - name: Publish to rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "Latest build" --notes "Automated build from main" --target ${{ github.sha }} || true
          gh release upload latest build/distributions/intellij-varlock-plugin-latest.zip --clobber
